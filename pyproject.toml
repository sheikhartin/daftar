[tool.poetry]
name = "daftar"
version = "1.0.0"
description = "The website of a person named Artin!"
authors = ["Artin Mohammadi <sheikhartin@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sheikhartin/daftar"
keywords = ["portfolio", "personal-website", "django", "web-development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
]

[tool.poetry.dependencies]
python = "^3.10"
django = ">=5.2.17,<5.3"
psycopg2-binary = "^2.9.12"
django-environ = "^0.14.0"
markdown = "^3.10.3"
pygments = "^2.21.0"
nh3 = "^0.3.7"
mysqlclient = "^2.3.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.4"
faker = "^40.37.0"

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
# Mutable class attributes (Django Meta options, admin list_display, ...)
# are idiomatic in Django projects.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Django and are not hand-formatted.
"portfolio/migrations/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
